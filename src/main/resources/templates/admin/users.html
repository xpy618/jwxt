<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 教务管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/htmx.min.js"></script>
</head>
<body>

<div class="sakura-container">
    <div class="sakura" style="left: 5%; animation-duration: 12s; animation-delay: 0s; --size: 20px;"></div>
    <div class="sakura" style="left: 18%; animation-duration: 14s; animation-delay: 2s; --size: 16px;"></div>
    <div class="sakura" style="left: 35%; animation-duration: 11s; animation-delay: 4s; --size: 22px;"></div>
    <div class="sakura" style="left: 52%; animation-duration: 15s; animation-delay: 1s; --size: 18px;"></div>
    <div class="sakura" style="left: 70%; animation-duration: 13s; animation-delay: 3s; --size: 24px;"></div>
    <div class="sakura" style="left: 85%; animation-duration: 16s; animation-delay: 5s; --size: 20px;"></div>
</div>

<div class="page-wrapper">
    <div th:replace="fragments :: navbar"></div>

    <div class="container">
        <div class="page-header">
            <h2>用户管理</h2>
            <p>管理系统中的所有用户账号</p>
        </div>

        <div id="users-stats" class="users-stats" style="display:none;">
            <div class="stat-card">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">总用户</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-admin">0</div>
                <div class="stat-label">管理员</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-teacher">0</div>
                <div class="stat-label">教师</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-student">0</div>
                <div class="stat-label">学生</div>
            </div>
        </div>

        <div id="users-toolbar" class="users-toolbar" style="display:none;">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" id="search-input" placeholder="搜索用户名、姓名、邮箱...">
            </div>
            <div class="toolbar-row">
                <select class="filter-select" id="filter-role">
                    <option value="">全部角色</option>
                    <option value="ADMIN">管理员</option>
                    <option value="TEACHER">教师</option>
                    <option value="STUDENT">学生</option>
                </select>
                <select class="filter-select" id="filter-status">
                    <option value="">全部状态</option>
                    <option value="active">正常</option>
                    <option value="disabled">已禁用</option>
                </select>
            </div>
        </div>

        <div id="users-table" class="table-wrapper">
            <div style="text-align:center; padding:40px; color:var(--text-lighter);">加载中...</div>
        </div>
    </div>
</div>

<div th:replace="fragments :: scripts"></div>

<script th:inline="javascript">
var CURRENT_USER_ID = /*[[${userId}]]*/ 0;
var allUsers = [];

function authHeader() {
    var token = localStorage.getItem('jwxt_token');
    return token ? { 'Authorization': 'Bearer ' + token } : {};
}

function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function roleBadgeClass(role) {
    if (role === 'ADMIN') return 'badge-role-admin';
    if (role === 'TEACHER') return 'badge-role-teacher';
    return 'badge-role-student';
}

function roleBadgeLabel(role) {
    if (role === 'ADMIN') return '管理员';
    if (role === 'TEACHER') return '教师';
    return '学生';
}

function updateStats(users) {
    var total = users.length;
    var admin = 0, teacher = 0, student = 0;
    for (var i = 0; i < users.length; i++) {
        if (users[i].role === 'ADMIN') admin++;
        else if (users[i].role === 'TEACHER') teacher++;
        else student++;
    }
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-admin').textContent = admin;
    document.getElementById('stat-teacher').textContent = teacher;
    document.getElementById('stat-student').textContent = student;
}

function renderUsers(users) {
    var container = document.getElementById('users-table');
    if (users.length === 0) {
        container.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>没有匹配的用户</p></div>';
        return;
    }
    var html = '<table><thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>角色</th><th>邮箱</th><th>手机</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>';
    for (var i = 0; i < users.length; i++) {
        var u = users[i];
        var isSelf = u.id === CURRENT_USER_ID;
        html += '<tr>';
        html += '<td>' + u.id + '</td>';
        html += '<td><div class="user-info-cell"><span class="user-avatar">' + esc(u.name.charAt(0)) + '</span><strong>' + esc(u.username) + '</strong></div></td>';
        html += '<td>' + esc(u.name) + '</td>';
        html += '<td><span class="' + roleBadgeClass(u.role) + '">' + roleBadgeLabel(u.role) + '</span></td>';
        html += '<td class="cell-muted">' + (u.email ? esc(u.email) : '-') + '</td>';
        html += '<td class="cell-muted">' + (u.phone ? esc(u.phone) : '-') + '</td>';
        html += '<td>' + (u.enabled ? '<span class="badge-active">正常</span>' : '<span class="badge-disabled">已禁用</span>') + '</td>';
        html += '<td class="cell-muted">' + (u.createdAt ? new Date(u.createdAt).toLocaleDateString('zh-CN') : '-') + '</td>';
        html += '<td class="actions-cell">';
        if (u.enabled) {
            html += '<button class="btn btn-sm btn-outline" onclick="toggleStatus(' + u.id + ', false)">禁用</button>';
        } else {
            html += '<button class="btn btn-sm btn-success" onclick="toggleStatus(' + u.id + ', true)">启用</button>';
        }
        html += '<button class="btn btn-sm btn-outline" onclick="resetPassword(' + u.id + ', \'' + esc(u.username) + '\')">重置密码</button>';
        if (!isSelf && u.role !== 'ADMIN') {
            html += '<button class="btn btn-sm btn-danger" onclick="deleteUser(' + u.id + ', \'' + esc(u.username) + '\')">删除</button>';
        }
        html += '</td>';
        html += '</tr>';
    }
    html += '</tbody></table>';
    container.innerHTML = html;
}

function filterUsers() {
    var keyword = document.getElementById('search-input').value.toLowerCase().trim();
    var role = document.getElementById('filter-role').value;
    var status = document.getElementById('filter-status').value;

    var filtered = allUsers.filter(function(u) {
        if (role && u.role !== role) return false;
        if (status === 'active' && !u.enabled) return false;
        if (status === 'disabled' && u.enabled) return false;
        if (keyword) {
            return (u.username && u.username.toLowerCase().indexOf(keyword) !== -1)
                || (u.name && u.name.toLowerCase().indexOf(keyword) !== -1)
                || (u.email && u.email.toLowerCase().indexOf(keyword) !== -1);
        }
        return true;
    });
    renderUsers(filtered);
}

async function loadUsers() {
    var container = document.getElementById('users-table');
    try {
        var resp = await fetch('/api/admin/users', { headers: authHeader() });
        var data = await resp.json();
        if (data.code !== 200 || !data.data || data.data.length === 0) {
            container.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>暂无用户</p></div>';
            return;
        }
        allUsers = data.data;
        updateStats(allUsers);
        renderUsers(allUsers);
        document.getElementById('users-stats').style.display = 'grid';
        document.getElementById('users-toolbar').style.display = 'flex';

        document.getElementById('search-input').addEventListener('input', filterUsers);
        document.getElementById('filter-role').addEventListener('change', filterUsers);
        document.getElementById('filter-status').addEventListener('change', filterUsers);
    } catch (e) {
        container.innerHTML = '<div class="empty-state"><span class="empty-icon">❌</span><p>加载失败</p></div>';
    }
}

async function toggleStatus(userId, enabled) {
    var action = enabled ? '启用' : '禁用';
    if (!confirm('确定要' + action + '该用户吗？')) return;
    try {
        var resp = await fetch('/api/admin/users/' + userId + '/status', {
            method: 'PUT',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
            body: JSON.stringify({ enabled: enabled })
        });
        var data = await resp.json();
        if (data.code === 200) {
            showAlert('用户已' + action, 'success');
            loadUsers();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (e) {
        showAlert('网络错误', 'error');
    }
}

async function resetPassword(userId, username) {
    if (!confirm('确定要重置用户「' + username + '」的密码为 123456 吗？')) return;
    try {
        var resp = await fetch('/api/admin/users/' + userId + '/reset-password', {
            method: 'PUT',
            headers: authHeader()
        });
        var data = await resp.json();
        if (data.code === 200) {
            showAlert('密码已重置为 123456', 'success');
        } else {
            showAlert(data.message, 'error');
        }
    } catch (e) {
        showAlert('网络错误', 'error');
    }
}

async function deleteUser(userId, username) {
    if (!confirm('确定要删除用户「' + username + '」吗？\n该操作将同时删除该用户的所有关联数据（选课记录、成绩等），不可撤销！')) return;
    try {
        var resp = await fetch('/api/admin/users/' + userId, {
            method: 'DELETE',
            headers: authHeader()
        });
        var data = await resp.json();
        if (data.code === 200) {
            showAlert('用户已删除', 'success');
            loadUsers();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (e) {
        showAlert('网络错误', 'error');
    }
}

loadUsers();
</script>

</body>
</html>
