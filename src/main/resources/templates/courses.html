<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${role == 'STUDENT'} ? '课程浏览' : '课程管理'">课程 - 教务管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/htmx.min.js"></script>
    <style>
        .basket-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 2px solid var(--pink);
            z-index: 150;
            transition: var(--transition);
        }
        .basket-bar.collapsed .basket-body { display: none; }
        .basket-bar.collapsed .basket-arrow { transform: rotate(0deg); }
        .basket-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            cursor: pointer;
            user-select: none;
        }
        .basket-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .basket-count {
            font-weight: 700;
            color: var(--pink-deep);
            font-size: 15px;
        }
        .basket-credits {
            font-size: 13px;
            color: var(--text-light);
        }
        .basket-credits.warn { color: #D44; font-weight: 600; }
        .basket-arrow {
            font-size: 20px;
            color: var(--pink);
            transition: transform 0.3s;
            transform: rotate(180deg);
        }
        .basket-body {
            padding: 0 24px 16px;
            max-height: 280px;
            overflow-y: auto;
        }
        .basket-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,183,197,0.2);
            font-size: 14px;
        }
        .basket-item.conflict { color: #D44; }
        .basket-item .basket-item-name { flex: 1; }
        .basket-item .basket-item-credit { color: var(--pink-deep); font-weight: 600; margin: 0 12px; }
        .basket-item .basket-item-remove { cursor: pointer; color: var(--text-lighter); font-size: 18px; line-height: 1; }
        .basket-item .basket-item-remove:hover { color: #D44; }
        .basket-warnings {
            margin-top: 8px;
            padding: 8px 12px;
            background: #FFF8F0;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: #E8A030;
        }
        .basket-warnings div { margin-bottom: 4px; }
        .basket-warnings div:last-child { margin-bottom: 0; }
        .basket-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .basket-empty {
            padding: 16px 0;
            text-align: center;
            color: var(--text-lighter);
            font-size: 14px;
        }
        .course-card.in-basket {
            border: 2px solid var(--pink);
        }
        .course-card.conflict-card {
            border: 2px solid #FF6B6B;
            background: rgba(255,107,107,0.03);
        }
    </style>
</head>
<body>

<div class="sakura-container">
    <div class="sakura" style="left: 5%; animation-duration: 12s; animation-delay: 0s; --size: 20px;"></div>
    <div class="sakura" style="left: 18%; animation-duration: 14s; animation-delay: 2s; --size: 16px;"></div>
    <div class="sakura" style="left: 30%; animation-duration: 11s; animation-delay: 4s; --size: 22px;"></div>
    <div class="sakura" style="left: 48%; animation-duration: 15s; animation-delay: 1s; --size: 18px;"></div>
    <div class="sakura" style="left: 62%; animation-duration: 13s; animation-delay: 3s; --size: 24px;"></div>
    <div class="sakura" style="left: 78%; animation-duration: 16s; animation-delay: 5s; --size: 20px;"></div>
    <div class="sakura" style="left: 90%; animation-duration: 14s; animation-delay: 0s; --size: 21px;"></div>
</div>

<div class="page-wrapper">
    <div th:replace="fragments :: navbar"></div>

    <div class="container">
        <div class="page-header" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2 th:text="${role == 'STUDENT'} ? '📚 课程浏览' : '📚 课程管理'">课程</h2>
                <p th:text="${role == 'STUDENT'} ? '浏览并选择你感兴趣的课程' : '管理你的课程信息'"></p>
            </div>
            <button th:if="${role == 'TEACHER' or role == 'ADMIN'}" class="btn btn-primary" onclick="openCourseModal()">
                ＋ 新增课程
            </button>
        </div>

        <div id="course-grid" class="card-grid">
            <div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-lighter);">
                ⏳ 加载中...
            </div>
        </div>
    </div>

    <th:block th:if="${role == 'STUDENT'}">
    <div id="basket-bar" class="basket-bar collapsed" style="display:none;">
        <div class="basket-header" onclick="toggleBasket()">
            <div class="basket-header-left">
                <span class="basket-count" id="basket-count-text">预选篮 (0)</span>
                <span class="basket-credits" id="basket-credits-text"></span>
            </div>
            <span class="basket-arrow">▲</span>
        </div>
        <div class="basket-body" id="basket-body"></div>
    </div>
    </th:block>
</div>

<th:block th:if="${role == 'TEACHER' or role == 'ADMIN'}">
<div id="course-modal" class="modal-overlay">
    <div class="modal">
        <h3 id="modal-title">新增课程</h3>
        <form id="course-form" onsubmit="saveCourse(event)">
            <input type="hidden" id="course-id">
            <div class="form-group">
                <label>课程名称 *</label>
                <input type="text" id="course-name" placeholder="请输入课程名称" required>
            </div>
            <div class="form-group">
                <label>课程描述</label>
                <input type="text" id="course-desc" placeholder="简要描述课程内容">
            </div>
            <div class="form-group">
                <label>学分 *</label>
                <input type="number" id="course-credit" placeholder="例如 3.0" step="0.5" min="0.5" required>
            </div>
            <div class="form-group">
                <label>最大人数 *</label>
                <input type="number" id="course-max" placeholder="例如 30" min="1" required>
            </div>
            <div class="form-group">
                <label>学期 *</label>
                <input type="text" id="course-semester" placeholder="例如 2025-2026-2" value="2025-2026-2" required>
            </div>
            <div class="form-group">
                <label>课程类别</label>
                <select id="course-category" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
                    <option value="ELECTIVE">选修</option>
                    <option value="REQUIRED">必修</option>
                    <option value="PE">体育</option>
                </select>
            </div>
            <div class="form-group">
                <label>任课教师</label>
                <select id="course-teacher" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
                    <option value="">（默认：本人）</option>
                </select>
            </div>
            <div class="form-group">
                <label>上课时间</label>
                <div class="schedule-picker">
                    <div class="picker-header"></div>
                    <div class="picker-header">周一</div>
                    <div class="picker-header">周二</div>
                    <div class="picker-header">周三</div>
                    <div class="picker-header">周四</div>
                    <div class="picker-header">周五</div>
                    <div class="picker-row-label">第一大节<br><small>08:20-10:00</small></div>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周一 08:20-10:00"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周二 08:20-10:00"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周三 08:20-10:00"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周四 08:20-10:00"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周五 08:20-10:00"></label>
                    <div class="picker-row-label">第二大节<br><small>10:20-12:00</small></div>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周一 10:20-12:00"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周二 10:20-12:00"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周三 10:20-12:00"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周四 10:20-12:00"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周五 10:20-12:00"></label>
                    <div class="picker-row-label">第三大节<br><small>14:30-16:10</small></div>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周一 14:30-16:10"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周二 14:30-16:10"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周三 14:30-16:10"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周四 14:30-16:10"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周五 14:30-16:10"></label>
                    <div class="picker-row-label">第四大节<br><small>16:30-18:10</small></div>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周一 16:30-18:10"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周二 16:30-18:10"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周三 16:30-18:10"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周四 16:30-18:10"></label>
                    <label class="picker-cell"><input type="checkbox" name="schedules" value="周五 16:30-18:10"></label>
                </div>
            </div>
            <div class="form-group">
                <label>周次范围</label>
                <div style="display:flex; gap:8px; align-items:center;">
                    <select id="course-start-week" style="flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
                    </select>
                    <span style="color:var(--text-lighter);">—</span>
                    <select id="course-end-week" style="flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>上课地点</label>
                <input type="text" id="course-location" placeholder="例如 致远-107">
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-outline" onclick="closeCourseModal()">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
</th:block>

<div th:replace="fragments :: scripts"></div>

<script th:inline="javascript">
const ROLE = /*[[${role}]]*/ 'STUDENT';
var basket = [];
var previewWarnings = [];
var conflictIds = [];

function inBasket(courseId) {
    for (var i = 0; i < basket.length; i++) {
        if (basket[i].id === courseId) return true;
    }
    return false;
}

function toggleBasket() {
    var bar = document.getElementById('basket-bar');
    bar.classList.toggle('collapsed');
}

function addToBasket(c) {
    if (inBasket(c.id)) return;
    basket.push(c);
    updateBasket();
}

function removeFromBasket(courseId) {
    basket = basket.filter(function(x) { return x.id !== courseId; });
    updateBasket();
}

function clearBasket() {
    basket = [];
    updateBasket();
}

async function updateBasket() {
    var bar = document.getElementById('basket-bar');
    var countEl = document.getElementById('basket-count-text');
    var creditsEl = document.getElementById('basket-credits-text');
    var body = document.getElementById('basket-body');

    if (basket.length === 0) {
        bar.style.display = 'none';
        bar.classList.add('collapsed');
        previewWarnings = [];
        conflictIds = [];
        renderCourseCards();
        return;
    }

    bar.style.display = 'block';
    countEl.textContent = '预选篮 (' + basket.length + ')';

    var previewCredits = 0;
    for (var i = 0; i < basket.length; i++) {
        previewCredits += basket[i].credit;
    }
    creditsEl.textContent = previewCredits.toFixed(1) + ' 学分';
    creditsEl.className = 'basket-credits';

    // Call preview API
    var courseIds = basket.map(function(x) { return x.id; });
    try {
        var resp = await fetch('/api/enrollments/preview', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
            body: JSON.stringify({ courseIds: courseIds })
        });
        var data = await resp.json();
        if (data.code === 200 && data.data) {
            previewWarnings = data.data.warnings || [];
            conflictIds = data.data.conflictCourseIds || [];
            if (!data.data.valid) {
                creditsEl.className = 'basket-credits warn';
            }
        } else {
            previewWarnings = [];
            conflictIds = [];
        }
    } catch (e) {
        previewWarnings = [];
        conflictIds = [];
    }

    // Render basket body
    var html = '';
    for (var i = 0; i < basket.length; i++) {
        var item = basket[i];
        var isConflict = conflictIds.indexOf(item.id) !== -1;
        html += '<div class="basket-item' + (isConflict ? ' conflict' : '') + '">';
        html += '<span class="basket-item-name">' + esc(item.name) + (isConflict ? ' ⚠' : '') + '</span>';
        html += '<span class="basket-item-credit">' + item.credit + ' 学分</span>';
        html += '<span class="basket-item-remove" onclick="removeFromBasket(' + item.id + ')" title="移出预选篮">×</span>';
        html += '</div>';
    }

    if (previewWarnings.length > 0) {
        html += '<div class="basket-warnings">';
        for (var j = 0; j < previewWarnings.length; j++) {
            html += '<div>' + esc(previewWarnings[j]) + '</div>';
        }
        html += '</div>';
    }

    html += '<div class="basket-actions">';
    html += '<button class="btn btn-sm btn-outline" onclick="clearBasket()">清空预选篮</button>';
    html += '<button class="btn btn-sm btn-primary" onclick="confirmBasket()"' + (previewWarnings.length > 0 ? '' : '') + '>确认选课</button>';
    html += '</div>';

    body.innerHTML = html;
    renderCourseCards();
}

function renderCourseCards() {
    // Update card highlight states
    var cards = document.querySelectorAll('.course-card');
    for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var cid = parseInt(card.getAttribute('data-course-id'));
        if (isNaN(cid)) continue;
        card.classList.remove('in-basket', 'conflict-card');
        if (inBasket(cid)) {
            card.classList.add('in-basket');
            if (conflictIds.indexOf(cid) !== -1) {
                card.classList.add('conflict-card');
            }
        }
    }
}

async function confirmBasket() {
    if (basket.length === 0) return;
    if (previewWarnings.length > 0) {
        if (!confirm('预选方案存在风险提示，确定仍要提交选课吗？')) return;
    }
    var successCount = 0;
    var failMessages = [];
    for (var i = 0; i < basket.length; i++) {
        try {
            var resp = await fetch('/api/enrollments', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
                body: JSON.stringify({ courseId: basket[i].id })
            });
            var data = await resp.json();
            if (data.code === 200) {
                successCount++;
            } else {
                failMessages.push(basket[i].name + ': ' + data.message);
            }
        } catch (e) {
            failMessages.push(basket[i].name + ': 网络错误');
        }
    }
    if (failMessages.length > 0) {
        showAlert('成功 ' + successCount + ' 门，失败：' + failMessages.join('；'), 'error');
    } else {
        showAlert('全部选课成功！共 ' + successCount + ' 门', 'success');
    }
    basket = [];
    previewWarnings = [];
    conflictIds = [];
    updateBasket();
    loadCourses();
}

async function loadCourses() {
    var grid = document.getElementById('course-grid');
    try {
        var url = ROLE === 'STUDENT' ? '/api/courses/with-enrollment' : '/api/courses/manage';
        var resp = await fetch(url, { headers: authHeader() });
        var data = await resp.json();
        if (data.code !== 200 || !data.data || data.data.length === 0) {
            grid.innerHTML = '<div class="empty-state"><span class="empty-icon">📭</span><p>暂无课程</p></div>';
            return;
        }
        var courses = data.data;
        var html = '';
        for (var i = 0; i < courses.length; i++) {
            var c = courses[i];
            var enrolled = c.enrolled !== undefined ? c.enrolled : false;
            var enrolledCount = c.enrolledCount || 0;
            var full = enrolledCount >= c.maxStudents;
            var inB = inBasket(c.id);

            html += '<div class="card course-card' + (inB ? ' in-basket' : '') + (inB && conflictIds.indexOf(c.id) !== -1 ? ' conflict-card' : '') + '" data-course-id="' + c.id + '">';
            html += '<div class="course-header">';
            html += '<span class="course-name">' + esc(c.name) + '</span>';
            html += '<span class="course-credit">' + c.credit + ' 学分</span>';
            html += '</div>';
            html += '<div class="course-meta">';
            html += '<span>👩‍🏫 ' + esc(c.teacherName || '') + '</span>';
            html += '<span>📅 ' + esc(c.semester || '') + '</span>';
            if (c.schedule) html += '<span>🕐 ' + esc(c.schedule).replace(/；/g, '<br>🕐 ') + '</span>';
            if (c.location) html += '<span>📍 ' + esc(c.location).replace(/；/g, '<br>📍 ') + '</span>';
            if (c.startWeek && c.endWeek) html += '<span>📆 第' + c.startWeek + '-' + c.endWeek + '周</span>';
            html += '</div>';
            if (c.description) html += '<div class="course-desc">' + esc(c.description) + '</div>';
            html += '<div class="course-footer">';

            if (ROLE === 'STUDENT') {
                html += '<span class="enrollment-count">已选 <span class="count">' + enrolledCount + '</span>/' + c.maxStudents + '</span>';
                html += '<div style="display:flex; gap:6px;">';
                if (enrolled) {
                    html += '<button class="btn btn-sm btn-outline" onclick="unenroll(' + c.id + ')">退课</button>';
                } else if (inB) {
                    html += '<button class="btn btn-sm btn-outline" onclick="removeFromBasket(' + c.id + ')">移出预选篮</button>';
                } else {
                    html += '<button class="btn btn-sm btn-outline" style="border-color:var(--pink); color:var(--pink-deep);" onclick="addToBasketById(' + c.id + ')">＋ 预选篮</button>';
                    html += '<button class="btn btn-sm btn-primary" onclick="enroll(' + c.id + ')"' + (full ? ' disabled' : '') + '>';
                    html += full ? '已满' : '选课';
                    html += '</button>';
                }
                html += '</div>';
            } else {
                html += '<span class="enrollment-count">已选 <span class="count">' + enrolledCount + '</span>/' + c.maxStudents + '</span>';
                html += '<div class="teacher-actions">';
                html += '<button class="btn btn-sm btn-outline" data-course=\'' + JSON.stringify(c).replace(/'/g, '&#39;') + '\' onclick="editCourseFromButton(this)">编辑</button>';
                html += '<button class="btn btn-sm btn-danger" onclick="deleteCourse(' + c.id + ')">删除</button>';
                html += '</div>';
            }
            html += '</div></div>';
        }
        grid.innerHTML = html;
    } catch (e) {
        grid.innerHTML = '<div class="empty-state"><span class="empty-icon">❌</span><p>加载失败，请刷新重试</p></div>';
    }
}

function addToBasketById(courseId) {
    // Already in basket - shouldn't happen since button state handles this, but be safe
    if (inBasket(courseId)) return;
    // Find the course data from the rendered card or fetch courses
    // Re-fetch to get full course info
    fetch('/api/courses/with-enrollment', { headers: authHeader() }).then(function(resp) { return resp.json(); }).then(function(data) {
        if (data.code === 200 && data.data) {
            var courses = data.data;
            for (var i = 0; i < courses.length; i++) {
                if (courses[i].id === courseId) {
                    addToBasket(courses[i]);
                    return;
                }
            }
        }
    }).catch(function() {});
}


async function enroll(courseId) {
    try {
        var resp = await fetch('/api/enrollments', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
            body: JSON.stringify({ courseId: courseId })
        });
        var data = await resp.json();
        if (data.code === 200) {
            showAlert('选课成功！', 'success');
            loadCourses();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (e) {
        showAlert('网络错误', 'error');
    }
}

async function unenroll(courseId) {
    if (!confirm('确定要退选这门课程吗？')) return;
    try {
        var resp = await fetch('/api/enrollments/' + courseId, {
            method: 'DELETE',
            headers: authHeader()
        });
        var data = await resp.json();
        if (data.code === 200) {
            showAlert('退课成功', 'success');
            loadCourses();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (e) {
        showAlert('网络错误', 'error');
    }
}

function initWeekSelects() {
    var start = document.getElementById('course-start-week');
    var end = document.getElementById('course-end-week');
    if (start.options.length > 0) return;
    for (var i = 1; i <= 16; i++) {
        start.innerHTML += '<option value="' + i + '">第' + i + '周</option>';
        end.innerHTML += '<option value="' + i + '">第' + i + '周</option>';
    }
}

function openCourseModal() {
    document.getElementById('modal-title').textContent = '新增课程';
    document.getElementById('course-id').value = '';
    document.getElementById('course-name').value = '';
    document.getElementById('course-desc').value = '';
    document.getElementById('course-credit').value = '';
    document.getElementById('course-max').value = '';
    document.getElementById('course-semester').value = '2025-2026-2';
    document.getElementById('course-category').value = 'ELECTIVE';
    document.getElementById('course-location').value = '';
    document.querySelectorAll('input[name="schedules"]').forEach(function(cb) { cb.checked = false; });
    initWeekSelects();
    document.getElementById('course-start-week').value = '1';
    document.getElementById('course-end-week').value = '16';
    var select = document.getElementById('course-teacher');
    select.innerHTML = '<option value="">（默认：本人）</option>';
    fetch('/api/courses/teachers', { headers: authHeader() }).then(function(resp) { return resp.json(); }).then(function(data) {
        if (data.code === 200 && data.data) {
            for (var i = 0; i < data.data.length; i++) {
                var t = data.data[i];
                select.innerHTML += '<option value="' + t.id + '">' + esc(t.name) + ' (' + esc(t.username) + ')</option>';
            }
        }
    }).catch(function() {});
    select.value = '';
    document.getElementById('course-modal').classList.add('active');
}

function editCourseFromButton(btn) {
    var c = JSON.parse(btn.getAttribute('data-course'));
    document.getElementById('modal-title').textContent = '编辑课程';
    document.getElementById('course-id').value = c.id;
    document.getElementById('course-name').value = c.name;
    document.getElementById('course-desc').value = c.description || '';
    document.getElementById('course-credit').value = c.credit;
    document.getElementById('course-max').value = c.maxStudents;
    document.getElementById('course-semester').value = c.semester;
    document.getElementById('course-location').value = c.location || '';
    document.getElementById('course-category').value = c.category || 'ELECTIVE';
    document.getElementById('course-teacher').value = c.teacherId || '';
    initWeekSelects();
    document.getElementById('course-start-week').value = c.startWeek || 1;
    document.getElementById('course-end-week').value = c.endWeek || 16;
    var existingSchedules = c.schedule ? c.schedule.split('；') : [];
    document.querySelectorAll('input[name="schedules"]').forEach(function(cb) {
        cb.checked = existingSchedules.indexOf(cb.value) !== -1;
    });
    document.getElementById('course-modal').classList.add('active');
}

function closeCourseModal() {
    document.getElementById('course-modal').classList.remove('active');
}

async function saveCourse(e) {
    e.preventDefault();
    var id = document.getElementById('course-id').value;
    var schedules = [];
    document.querySelectorAll('input[name="schedules"]:checked').forEach(function(cb) {
        schedules.push(cb.value);
    });
    var body = {
        name: document.getElementById('course-name').value,
        description: document.getElementById('course-desc').value,
        credit: parseFloat(document.getElementById('course-credit').value),
        maxStudents: parseInt(document.getElementById('course-max').value),
        semester: document.getElementById('course-semester').value,
        schedules: schedules,
        location: document.getElementById('course-location').value,
        startWeek: parseInt(document.getElementById('course-start-week').value),
        endWeek: parseInt(document.getElementById('course-end-week').value),
        teacherId: document.getElementById('course-teacher').value ? parseInt(document.getElementById('course-teacher').value) : null,
        category: document.getElementById('course-category').value
    };
    var method = id ? 'PUT' : 'POST';
    var url = id ? '/api/courses/' + id : '/api/courses';

    try {
        var resp = await fetch(url, {
            method: method,
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
            body: JSON.stringify(body)
        });
        var data = await resp.json();
        if (data.code === 200) {
            showAlert(id ? '课程已更新' : '课程已创建', 'success');
            closeCourseModal();
            loadCourses();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (err) {
        showAlert('网络错误', 'error');
    }
}

async function deleteCourse(id) {
    if (!confirm('确定要删除这门课程吗？此操作不可撤销。')) return;
    try {
        var resp = await fetch('/api/courses/' + id, { method: 'DELETE', headers: authHeader() });
        var data = await resp.json();
        if (data.code === 200) {
            showAlert('课程已删除', 'success');
            loadCourses();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (e) {
        showAlert('网络错误', 'error');
    }
}

document.getElementById('course-modal') && document.getElementById('course-modal').addEventListener('click', function(e) {
    if (e.target === this) closeCourseModal();
});

loadCourses();
</script>

</body>
