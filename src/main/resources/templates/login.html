<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 教务管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/htmx.min.js"></script>
</head>
<body>

<div class="sakura-container">
    <div class="sakura" style="left: 5%; animation-duration: 12s; animation-delay: 0s; --size: 20px;"></div>
    <div class="sakura" style="left: 15%; animation-duration: 14s; animation-delay: 2s; --size: 16px;"></div>
    <div class="sakura" style="left: 25%; animation-duration: 11s; animation-delay: 4s; --size: 22px;"></div>
    <div class="sakura" style="left: 35%; animation-duration: 15s; animation-delay: 1s; --size: 18px;"></div>
    <div class="sakura" style="left: 45%; animation-duration: 13s; animation-delay: 3s; --size: 24px;"></div>
    <div class="sakura" style="left: 55%; animation-duration: 16s; animation-delay: 5s; --size: 20px;"></div>
    <div class="sakura" style="left: 65%; animation-duration: 12s; animation-delay: 0s; --size: 17px;"></div>
    <div class="sakura" style="left: 75%; animation-duration: 14s; animation-delay: 2s; --size: 21px;"></div>
    <div class="sakura" style="left: 85%; animation-duration: 11s; animation-delay: 4s; --size: 19px;"></div>
    <div class="sakura" style="left: 92%; animation-duration: 15s; animation-delay: 6s; --size: 23px;"></div>
    <div class="sakura" style="left: 10%; animation-duration: 13s; animation-delay: 1s; --size: 15px;"></div>
    <div class="sakura" style="left: 70%; animation-duration: 17s; animation-delay: 3s; --size: 22px;"></div>
</div>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="logo">
            <span class="icon">🌸</span>
            <h1>教务管理系统</h1>
            <p>Cherry Blossom · Teaching Affairs System</p>
        </div>

        <div id="login-error" class="alert alert-error" style="display:none;"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" id="username" placeholder="请输入用户名" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">🌸 登 录</button>
        </form>

        <div class="auth-footer">
            还没有账号？<a href="/register">立即注册</a>
        </div>
    </div>
</div>

<script>
async function handleLogin(e) {
    e.preventDefault();
    var errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    try {
        var resp = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            })
        });
        var data = await resp.json();
        if (data.code === 200) {
            localStorage.setItem('jwxt_token', data.data.token);
            localStorage.setItem('jwxt_role', data.data.role);
            localStorage.setItem('jwxt_name', data.data.name);
            localStorage.setItem('jwxt_userId', data.data.userId);
            document.cookie = 'jwxt_token=' + data.data.token + '; path=/; max-age=86400';
            window.location.href = '/index';
        } else {
            errEl.textContent = data.message;
            errEl.style.display = 'block';
        }
    } catch (err) {
        errEl.textContent = '网络错误，请重试';
        errEl.style.display = 'block';
    }
}
</script>

</body>
</html>
