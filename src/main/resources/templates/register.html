<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 教务管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="sakura-container">
    <div class="sakura" style="left: 5%; animation-duration: 12s; animation-delay: 0s; --size: 20px;"></div>
    <div class="sakura" style="left: 20%; animation-duration: 14s; animation-delay: 3s; --size: 16px;"></div>
    <div class="sakura" style="left: 40%; animation-duration: 11s; animation-delay: 1s; --size: 22px;"></div>
    <div class="sakura" style="left: 60%; animation-duration: 15s; animation-delay: 5s; --size: 18px;"></div>
    <div class="sakura" style="left: 80%; animation-duration: 13s; animation-delay: 2s; --size: 24px;"></div>
    <div class="sakura" style="left: 90%; animation-duration: 16s; animation-delay: 4s; --size: 17px;"></div>
    <div class="sakura" style="left: 30%; animation-duration: 14s; animation-delay: 6s; --size: 21px;"></div>
    <div class="sakura" style="left: 50%; animation-duration: 12s; animation-delay: 0s; --size: 19px;"></div>
</div>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="logo">
            <span class="icon">🌸</span>
            <h1>注册账号</h1>
            <p>加入教务管理系统</p>
        </div>

        <div id="reg-error" class="alert alert-error" style="display:none;"></div>
        <div id="reg-success" class="alert alert-success" style="display:none;"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" id="username" placeholder="3-50个字符" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" id="password" placeholder="至少6个字符" required>
            </div>
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="name" id="name" placeholder="请输入真实姓名" required>
            </div>
            <div class="form-group">
                <label>角色</label>
                <select name="role" id="role" required>
                    <option value="">请选择角色</option>
                    <option value="STUDENT">学生</option>
                    <option value="TEACHER">教师</option>
                </select>
            </div>
            <div class="form-group">
                <label>邮箱（选填）</label>
                <input type="email" name="email" id="email" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>手机号（选填）</label>
                <input type="text" name="phone" id="phone" placeholder="请输入手机号">
            </div>
            <button type="submit" class="btn btn-primary btn-block">🌸 注 册</button>
        </form>

        <div class="auth-footer">
            已有账号？<a href="/login">返回登录</a>
        </div>
    </div>
</div>

<script>
async function handleRegister(e) {
    e.preventDefault();
    var errEl = document.getElementById('reg-error');
    var successEl = document.getElementById('reg-success');
    errEl.style.display = 'none';
    successEl.style.display = 'none';

    try {
        var resp = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                name: document.getElementById('name').value,
                role: document.getElementById('role').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            })
        });
        var data = await resp.json();
        if (data.code === 200) {
            successEl.textContent = '注册成功！即将跳转到登录页...';
            successEl.style.display = 'block';
            setTimeout(function() { window.location.href = '/login'; }, 1500);
        } else {
            errEl.textContent = data.message;
            errEl.style.display = 'block';
        }
    } catch (err) {
        errEl.textContent = '网络错误，请重试';
        errEl.style.display = 'block';
    }
}
</script>

</body>
</html>
